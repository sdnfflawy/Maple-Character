<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maple Character</title>
<meta name="theme-color" content="#ffeaf2">
<style>
:root {
  --bg1: #ffeaf2;
  --bg2: #efe3fa;
  --pink: #f28cb4;
  --pink-deep: #b3407a;
  --rose: #e0679a;
  --lilac: #d9c8ec;
  --ink: #43283c;
  --muted: #8a6b7e;
  --card: rgba(255, 255, 255, .78);
  --shadow: 0 10px 30px rgba(179, 64, 122, .12);
  --ring: rgba(224, 103, 154, .35);
  color-scheme: light
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--ink);
  font: 16px/1.55 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(160deg, var(--bg1) 0%, #fff6fa 45%, var(--bg2) 100%) fixed;
}
main {
  flex: 1;
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 2.6rem 18px 2rem;
}
.hidden {
  display: none !important;
}
.hero {
  text-align: center;
  margin-bottom: 1.6rem;
}
.eyebrow {
  display: inline-block;
  font-size: .75rem;
  font-weight: 800;
  letter-spacing: .18em;
  color: var(--rose);
  background: #fff;
  padding: .25rem .8rem;
  border-radius: 999px;
  box-shadow: var(--shadow);
}
.hero h1 {
  margin: .7rem 0 .3rem;
  font-size: 2.2rem;
  font-weight: 900;
  letter-spacing: -.03em;
  background: linear-gradient(90deg, var(--pink-deep), var(--pink) 60%, #b99ae0);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero p {
  margin: 0;
  color: var(--muted);
}
button, input {
  font: inherit;
  color: inherit;
}
.search {
  max-width: 760px;
  margin: 0 auto 1.8rem;
  background: var(--card);
  backdrop-filter: blur(8px);
  border-radius: 28px;
  box-shadow: var(--shadow);
  padding: .7rem;
}
.search-row {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
}
.field {
  flex: 1 1 200px;
  min-width: 0;
  border: 0;
  background: #fff;
  border-radius: 20px;
  padding: .8rem 1.1rem;
  box-shadow: inset 0 0 0 1.5px #f4d6e3;
}
.field:focus {
  outline: none;
  box-shadow: inset 0 0 0 2px var(--rose), 0 0 0 4px var(--ring);
}
.go {
  border: 0;
  border-radius: 20px;
  padding: .8rem 1.6rem;
  background: linear-gradient(135deg, var(--pink), var(--rose));
  color: #fff;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  box-shadow: 0 6px 16px rgba(224, 103, 154, .35);
  transition: transform .12s, box-shadow .12s;
}
.go:hover {
  transform: translateY(-1px);
}
.go:active {
  transform: translateY(1px);
}
.go:disabled {
  opacity: .65;
  cursor: default;
}
.go:focus-visible {
  outline: 3px solid var(--ring);
  outline-offset: 2px;
}
.keybar {
  display: flex;
  align-items: center;
  gap: .6rem;
  flex-wrap: wrap;
  margin: .6rem .6rem .1rem;
  font-size: .82rem;
  color: var(--muted);
}
.keybar .field {
  flex: 1 1 220px;
  padding: .45rem .9rem;
  border-radius: 14px;
  font-size: .85rem;
}
.keybar label {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  cursor: pointer;
}
.mini {
  border: 0;
  background: none;
  color: var(--pink-deep);
  font-weight: 700;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
}
input[type=checkbox] {
  accent-color: var(--rose);
  width: 1rem;
  height: 1rem;
  margin: 0;
}
.spinner {
  width: 1rem;
  height: 1rem;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.alert {
  max-width: 760px;
  margin: 0 auto 1.2rem;
  padding: .75rem 1.1rem;
  border-radius: 18px;
  background: #fff0f3;
  color: #9b2f56;
  box-shadow: inset 0 0 0 1.5px #f5b7c9;
}
.empty {
  text-align: center;
  color: var(--muted);
  padding: 2.5rem 1rem;
}
.empty .bubble {
  font-size: 2.4rem;
  line-height: 1;
}
.empty p {
  margin: .4rem 0 0;
}
.dash {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 1.4rem;
  align-items: start;
}
.profile {
  position: sticky;
  top: 1rem;
  border-radius: 32px;
  padding: 1.4rem 1.4rem 1.5rem;
  background: linear-gradient(170deg, #ffd0e2 0%, #f6c5ec 55%, #d9c8ec 100%);
  box-shadow: var(--shadow);
  text-align: center;
}
.stage {
  height: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 28px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, .55));
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .8), 0 6px 16px rgba(179, 64, 122, .12);
  margin-bottom: .9rem;
  padding: 14px;
  overflow: hidden;
}
.char-img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 6px 5px rgba(179, 64, 122, .22));
}
.char-name {
  font-size: 1.6rem;
  font-weight: 900;
  letter-spacing: -.02em;
}
.char-sub {
  color: #7a4a69;
  font-weight: 600;
  font-size: .9rem;
  margin-bottom: .9rem;
}
.plist {
  margin: 0 0 1rem;
  background: rgba(255, 255, 255, .55);
  border-radius: 20px;
  padding: .3rem 1rem;
  text-align: left;
}
.plist div {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  padding: .45rem 0;
  border-bottom: 1px solid rgba(179, 64, 122, .12);
}
.plist div:last-child {
  border-bottom: 0;
}
.plist dt {
  color: #85566f;
  font-size: .88rem;
}
.plist dd {
  margin: 0;
  font-weight: 800;
  text-align: right;
}
.exp-top {
  display: flex;
  justify-content: space-between;
  font-size: .8rem;
  font-weight: 800;
  margin-bottom: .3rem;
  color: #7a3a61;
}
.bar {
  height: 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .7);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #f28cb4, #b99ae0);
}
.stats {
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
}
.power {
  border-radius: 28px;
  padding: 1.4rem 1.7rem;
  color: #fff;
  background: linear-gradient(120deg, #c04c85, #f28cb4 70%, #e6a6d8);
  box-shadow: 0 14px 30px rgba(179, 64, 122, .3);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-end;
  gap: .5rem;
}
.power small {
  font-weight: 800;
  letter-spacing: .14em;
  font-size: .72rem;
  opacity: .9;
}
.power .big {
  font-size: 2.3rem;
  font-weight: 900;
  letter-spacing: -.02em;
  line-height: 1.2;
  word-break: keep-all;
}
.power .raw {
  opacity: .85;
  font-size: .9rem;
  font-weight: 600;
}
.group {
  background: var(--card);
  border-radius: 26px;
  padding: 1.1rem 1.2rem 1.2rem;
  box-shadow: var(--shadow);
}
.group h3 {
  margin: 0 0 .75rem;
  font-size: .95rem;
  font-weight: 800;
  color: var(--pink-deep);
  display: flex;
  align-items: center;
  gap: .6rem;
}
.group h3::after {
  content: "";
  flex: 1;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, #f6cfe0, transparent);
}
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: .6rem;
}
.tile {
  background: #fff;
  border-radius: 16px;
  padding: .6rem .85rem;
  display: flex;
  flex-direction: column;
  gap: .1rem;
  box-shadow: 0 2px 0 #f7dbe8;
}
.tile span {
  font-size: .76rem;
  color: var(--muted);
  font-weight: 600;
}
.tile b {
  font-size: 1.08rem;
  font-weight: 800;
  word-break: keep-all;
}
.note {
  color: var(--muted);
  font-size: .82rem;
  text-align: center;
  margin: 1.4rem 0 0;
}
footer {
  text-align: center;
  color:var(--muted);
  font-size: .8rem;
  padding: 1rem 0 1.5rem;
}
@media(max-width: 820px) {
  .dash {
    grid-template-columns: 1fr
  }
  .profile {
    position: static
  }
  .hero h1 {
    font-size: 1.8rem
  }
  .power .big {
    font-size: 1.8rem
  }
}
</style>
</head>
<body>
<main>
  <div class="hero">
    <span class="eyebrow">MAPLE CHARACTER</span>
    <h1>메이플 캐릭터 조회</h1>
    <p>닉네임만 입력하면 기본 정보와 종합 능력치를 한눈에 보여드려요.</p>
  </div>

  <section class="search">
    <div class="search-row">
      <input id="nameInput" type="text" class="field" autocomplete="off" spellcheck="false" placeholder="캐릭터 닉네임을 입력하세요" aria-label="캐릭터 닉네임">
      <button id="searchBtn" type="button" class="go"><span id="spin" class="spinner hidden"></span><span id="searchLabel">조회하기</span></button>
    </div>
    <div class="keybar">
      <span>API 키</span>
      <input id="apiKeyInput" type="password" class="field" autocomplete="off" spellcheck="false" placeholder="넥슨 Open API 키" aria-label="넥슨 Open API 키">
      <button id="toggleKeyBtn" type="button" class="mini">보기</button>
      <label for="rememberKey"><input id="rememberKey" type="checkbox">이 PC에 기억</label>
    </div>
  </section>

  <div id="errorBox" class="alert hidden" role="alert"></div>
  <section id="emptyState" class="empty"><div class="bubble">🌸</div><p><strong>아직 조회한 캐릭터가 없어요</strong></p><p>닉네임을 입력하고 조회하기를 눌러 주세요.</p></section>
  <section id="result" class="hidden"></section>
</main>
<footer>Data based on NEXON Open API</footer>
<script>
(() => {
  'use strict';
  const BASE = 'https://open.api.nexon.com/maplestory/v1/';
  const STORAGE_KEY = 'mc.apiKey';
  const MSG = {
    OPENAPI00002: '이 키로는 접근할 수 없어요. 메이플스토리용 키인지 확인해주세요.',
    OPENAPI00003: '닉네임에 해당하는 캐릭터를 찾지 못했어요. 철자와 대소문자를 확인해주세요.',
    OPENAPI00005: 'API 키가 올바르지 않아요. 키를 다시 복사해 붙여넣어 보세요.',
    OPENAPI00007: '넥슨 호출 한도를 넘었어요. 잠시 후 다시 시도해주세요.',
    OPENAPI00009: '넥슨 쪽 데이터가 아직 준비 중이에요. 잠시 후 다시 시도해주세요.',
    OPENAPI00010: '게임 점검 중이에요. 점검이 끝난 뒤 다시 시도해주세요.',
    OPENAPI00011: '넥슨 API 점검 중이에요. 잠시 후 다시 시도해주세요.'  
  };

  const GROUPS = [
    ['전투 능력', ['최소 스탯공격력', '최대 스탯공격력', '공격력', '마력', '데미지', '보스 몬스터 데미지', '일반 몬스터 데미지', '최종 데미지', '방어율 무시', '크리티컬 확률', '크리티컬 데미지', '속성 내성 무시', '상태이상 추가 데미지']],
    ['기본 스탯', ['STR', 'DEX', 'INT', 'LUK', 'HP', 'MP', '방어력']],
    ['포스', ['스타포스', '아케인포스', '어센틱포스']],
    ['AP 배분', ['AP 배분 STR', 'AP 배분 DEX', 'AP 배분 INT', 'AP 배분 LUK', 'AP 배분 HP', 'AP 배분 MP']],
    ['유틸리티', ['아이템 드롭률', '메소 획득량', '추가 경험치 획득', '버프 지속시간', '소환수 지속시간 증가', '공격 속도', '재사용 대기시간 감소 (초)', '재사용 대기시간 감소 (%)', '재사용 대기시간 미적용', '이동속도', '점프력', '스탠스', '상태이상 내성', '무기 숙련도']]
  ];
  const PCT = new Set(['데미지','보스 몬스터 데미지','일반 몬스터 데미지','최종 데미지','방어율 무시','크리티컬 확률','크리티컬 데미지','속성 내성 무시','상태이상 추가 데미지','아이템 드롭률','메소 획득량','추가 경험치 획득','버프 지속시간','소환수 지속시간 증가','재사용 대기시간 감소 (%)','재사용 대기시간 미적용','이동속도','점프력','스탠스','상태이상 내성','무기 숙련도']);
  const NO_UNIT = new Set(['점프력','이동속도']); // 이동속도/점프력은 %로 표기되지만 게임 내 표시를 따름

  const $ = (id) => document.getElementById(id);
  const el = { key: $('apiKeyInput'), toggle: $('toggleKeyBtn'), remember: $('rememberKey'), name: $('nameInput'), btn: $('searchBtn'), spin: $('spin'), label: $('searchLabel'), err: $('errorBox'), empty: $('emptyState'), result: $('result') };
  const fmt = (n) => Number(n).toLocaleString('ko-KR');
  const ymd = (back) => new Date(Date.now() + 9 * 36e5 - back * 864e5).toISOString().slice(0, 10);
  function node(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function showError(m) {
    el.err.textContent = m;
    el.err.classList.remove('hidden');
  }
  function hideError() {
    el.err.classList.add('hidden');
  }
  function readKey() {
    try {
      return localStorage.getItem(STORAGE_KEY) || '';
    }
    catch(e) {
      return '';
    }
  }
  function writeKey(k) {
    try {
      k ? localStorage.setItem(STORAGE_KEY, k) : localStorage.removeItem(STORAGE_KEY);
    }
    catch(e) {} 
  }

  async function call(path, key) {
    let res;
    try {
      res = await fetch(BASE + path, { headers: { accept: 'application/json', 'x-nxopen-api-key': key } }); 
    }
    catch(e) {
      throw new Error('넥슨 서버에서 응답을 받지 못했어요. 인터넷 연결을 확인해주세요.');
    }
    const text = await res.text();
    if(!res.ok) {
      const code = (text.match(/OPENAPI\d{5}/) || [])[0];
      const err = new Error(code && MSG[code] ? `${MSG[code]} (${code})` : `넥슨 API 오류 (${res.status}) ${text.slice(0, 200)}`);
      err.code = code; throw err;
    }
    try {
      return JSON.parse(text);
    }
    catch(e) {
      throw new Error('넥슨 응답을 해석하지 못했어요.');
    }
  }

  async function withDate(kind, ocid, key) {
    for(const back of [1, 2]) {
      try {
        const q = `character/${kind}?ocid=${encodeURIComponent(ocid)}&date=${ymd(back)}`;
        return await call(q, key);
      } 
      catch(e) {
        if(!(e.code === 'OPENAPI00009' || e.code === 'OPENAPI00004') || back === 2) throw e;
      }
    }
  }

  function koreanUnit(n) {
    n = Number(n);
    if (!n) return '0';
    const u = [['조', 1e12], ['억', 1e8], ['만', 1e4]];
    let out = [];
    for(const [s, v] of u) {
      const q = Math.floor(n / v);
      if (q > 0) {
        out.push(fmt(q) + s);
        n -= q * v;
      }
    }
    if (n > 0 && out.length < 3) out.push(fmt(n));
    return out.join(' ');
  }

  function formatStat(name, v) {
    if(v === null || v === undefined || v === '') return '-';
    const num = Number(v);
    if(isNaN(num)) return String(v);
    if(name === '공격 속도') return `${num}단계`;
    if(PCT.has(name)) return `${Number.isInteger(num) ? fmt(num) : num.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%`;
    if(name === '재사용 대기시간 감소 (초)') return `${fmt(num)}초`;
    return fmt(num);
  }

  function buildChar(url, alt, stage) {
    const plain = () => {
      const im = node('img', 'char-img'); im.alt = alt; im.referrerPolicy = 'no-referrer'; im.src = url;
      im.addEventListener('error', () => im.classList.add('hidden'));
      stage.replaceChildren(im);
    };
    if(!url) return;
    const src = new Image();
    src.crossOrigin = 'anonymous'; src.referrerPolicy = 'no-referrer';
    src.onload = () => {
      try {
        const w = src.naturalWidth, h = src.naturalHeight;
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.drawImage(src, 0, 0);
        const d = x.getImageData(0, 0, w, h).data;
        let x0 = w, y0 = h, x1 = -1, y1 = -1;
        for(let j = 0; j < h; j++) {
          for(let i = 0; i < w; i++) {
            if(d[(j * w + i) * 4 + 3] > 24) {
              if(i < x0) x0 = i;
              if(i > x1) x1 = i;
              if(j < y0) y0 = j;
              if(j > y1) y1 = j;
            }
          }
        }
        if(x1 < 0) {
          plain();
          return;
        }
        const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
        const k = Math.max(1, Math.floor(Math.min(220 / cw, 220 / ch)));   // 정수 배율로 또렷하게 확대
        const out = document.createElement('canvas'); out.width = cw * k; out.height = ch * k; out.className = 'char-img';
        out.setAttribute('role', 'img'); out.setAttribute('aria-label', alt);
        const o = out.getContext('2d'); o.imageSmoothingEnabled = false;
        o.drawImage(src, x0, y0, cw, ch, 0, 0, cw * k, ch * k);
        stage.replaceChildren(out);
      }
      catch (e) {
        plain();
      }
    };
    src.onerror = plain;
    src.src = url;
  }

  function renderResult(basic, stat) {
    const box = el.result;
    box.replaceChildren();
    const stats = {};
    (stat.final_stat || []).forEach((s) => { stats[s.stat_name] = s.stat_value; });
    const rate = Math.max(0, Math.min(100, Number(basic.character_exp_rate) || 0));
    const dash = node('div', 'dash');

    const prof = node('aside', 'profile');
    const stage = node('div', 'stage');
    buildChar(basic.character_image || '', `${basic.character_name} 캐릭터 이미지`, stage);
    prof.append(stage, node('div', 'char-name', basic.character_name || '-'), node('div', 'char-sub', `${basic.character_class || '-'} · ${basic.world_name || '-'}`));
    const list = node('dl', 'plist');
    [['서버', basic.world_name], ['직업', basic.character_class], ['레벨', `Lv.${basic.character_level}`], ['길드', basic.character_guild_name || '없음']].forEach(([t, v]) => {
      const r = node('div'); r.append(node('dt', '', t), node('dd', '', v || '-'));
      list.append(r);
    });
    prof.append(list);
    const exp = node('div', 'exp');
    const top = node('div', 'exp-top');
    top.append(node('span', '', 'EXP'), node('b', '', `${rate}%`));
    const bar = node('div', 'bar');
    const fill = node('i');
    fill.style.width = rate + '%';
    bar.append(fill);
    exp.append(top, bar);
    prof.append(exp);

    const main = node('div', 'stats');
    if(stats['전투력'] !== undefined) {
      const p = node('div', 'power');
      const l = node('div');
      l.append(node('small', '', 'COMBAT POWER · 전투력'), node('div', 'big', koreanUnit(stats['전투력'])));
      p.append(l, node('div', 'raw', fmt(stats['전투력'])));
      main.append(p);
    }
    const used = new Set(['전투력']);
    const addGroup = (title, names) => {
      const present = names.filter((n) => stats[n] !== undefined);
      if(!present.length) return;
      const g = node('section', 'group');
      g.append(node('h3', '', title));
      const grid = node('div', 'tiles');
      present.forEach((n) => {
        used.add(n);
        const t = node('div', 'tile');
        t.append(node('span', '', n), node('b', '', formatStat(n, stats[n])));
        grid.append(t);
      });
      g.append(grid);
      main.append(g);
    };
    GROUPS.forEach(([t, names]) => addGroup(t, names));
    const rest = Object.keys(stats).filter((n) => !used.has(n));
    if(rest.length) addGroup('기타', rest);

    dash.append(prof, main);
    box.append(dash);
    const day = (basic.date || '').slice(0, 10);
    box.append(node('p', 'note', `기준일 ${day || ymd(1)} · 넥슨 Open API 기준 정보이며 실제 게임 화면과 차이가 있을 수 있어요.`));
    el.empty.classList.add('hidden');
    box.classList.remove('hidden');
  }

  function setLoading(on) {
    el.btn.disabled = on;
    el.spin.classList.toggle('hidden', !on);
    el.label.textContent = on ? '조회 중...' : '조회하기';
  }

  async function search() {
    const key = el.key.value.trim(), name = el.name.value.trim();
    if(!key) {
      showError('API 키를 입력해 주세요.');
      return;
    }
    if(!/^[\x21-\x7E]+$/.test(key)) {
      showError('API 키에 한글이나 공백이 섞여 있어요. 복사한 키만 붙여넣었는지 확인해주세요.');
      return;
    }
    if(!name) {
      showError('캐릭터 닉네임을 입력해 주세요.');
      return;
    }
    setLoading(true);
    hideError();
    try {
      const id = await call(`id?character_name=${encodeURIComponent(name)}`, key);
      if(!id.ocid) throw new Error(MSG.OPENAPI00003);
      const [basic, stat] = await Promise.all([withDate('basic', id.ocid, key), withDate('stat', id.ocid, key)]);
      renderResult(basic, stat);
      writeKey(el.remember.checked ? key : '');
    }
    catch(e) {
      showError(e.message);
    }
    finally {
      setLoading(false);
    }
  }

  const saved = readKey();
  if(saved) {
    el.key.value = saved;
    el.remember.checked = true;
  }
  el.btn.addEventListener('click', search);
  el.name.addEventListener('keydown', (ev) => {
    if(ev.key === 'Enter') search();
  });
  el.key.addEventListener('keydown', (ev) => {
    if(ev.key === 'Enter') search();
  });
  el.toggle.addEventListener('click', () => {
    const show = el.key.type === 'password';
    el.key.type = show ? 'text' : 'password';
    el.toggle.textContent = show ? '숨기기' : '보기';
  });
})();
</script>
</body>
</html>
